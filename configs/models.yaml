models:
  logistic_regression:
    C: 0.4
    max_iter: 1000
    class_weight: balanced
    solver: lbfgs

  random_forest:
    n_estimators: 100
    max_depth: null
    min_samples_split: 2
    class_weight: balanced
    n_jobs: -1

  xgboost:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 1

evaluation:
  primary_metric: f1_weighted
  metrics:
    - accuracy
    - f1_weighted
    - precision_weighted
    - recall_weighted
    - roc_auc